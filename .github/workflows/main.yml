name: Deploy to Remote Server

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: '请选择构建分支'
        required: true
        type: choice
        options:
          - dev
          - master
        default: dev
      deploy_to_cn_test:
        description: '部署到测试环境 (cn-test)'
        required: true
        type: boolean
        default: true
      deploy_to_cn_prod:
        description: '部署到生产环境 (cn-prod)'
        required: true
        type: boolean
        default: false
      deploy_to_global_prod:
        description: '部署到海外生产环境 (global-prod)'
        required: true
        type: boolean
        default: false
      action:
        description: '部署内容'
        required: true
        type: choice
        options:
          - '业务 (artifacts)'
          - 'FRP (frp)'
          - '仅拉取代码 (pull_only)'
          - '仅准备环境 (pull_prepare)'
        default: '业务 (artifacts)'
      build_strategy:
        description: '构建方式（FRP、仅拉代码忽略，缓存另选）'
        required: true
        type: choice
        options:
          - '全部重建 (infra)'
          - '重建依赖 (base)'
          - '增量更新 (cache)'
        default: '增量更新 (cache)'
      use_cache:
        description: '使用缓存（FRP、仅拉代码忽略）'
        required: true
        type: boolean
        default: true

# SSH 部署无需使用 GITHUB_TOKEN 访问仓库 API。
permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      deploy_matrix: ${{ steps.resolve_envs.outputs.deploy_matrix }}
    steps:
      - name: resolve deploy environments
        id: resolve_envs
        shell: bash
        run: |
          matrix_items=()

          if [ "${{ github.event.inputs.deploy_to_cn_test }}" = "true" ]; then
            matrix_items+=("{\"environment\":\"test\"}")
          fi

          if [ "${{ github.event.inputs.deploy_to_cn_prod }}" = "true" ]; then
            matrix_items+=("{\"environment\":\"prod\"}")
          fi

          if [ "${{ github.event.inputs.deploy_to_global_prod }}" = "true" ]; then
            matrix_items+=("{\"environment\":\"prod_global\"}")
          fi

          if [ ${#matrix_items[@]} -eq 0 ]; then
            echo "请至少选择一个部署环境（cn-test、cn-prod 或 global-prod）"
            exit 1
          fi

          deploy_matrix="[$(IFS=,; echo "${matrix_items[*]}")]"
          echo "deploy_matrix=${deploy_matrix}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.deploy_matrix) }}
    environment: ${{ matrix.environment }}
    env:
      REPO_PATH: '/usr/local/egeek/repo'
      ENC_KEY: ${{ secrets.ENC_KEY }}
      PROXIES_JSON: ${{ secrets.PROXIES_JSON }}
    steps:
      - name: 检查 SSH 服务器指纹
        shell: bash
        env:
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          if [[ ! "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "错误：请在当前 GitHub 环境中配置 SSH_FINGERPRINT，填写完整的 SHA256:... 指纹值。" >&2
            exit 1
          fi

      - name: 通过 SSH 执行部署
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          RAW_ACTION: ${{ inputs.action }}
          RAW_STR: ${{ inputs.build_strategy }}
          USE_CACHE: ${{ inputs.use_cache }}
        run: |
          set -euo pipefail

          # 临时保存登录密钥及经指纹校验的主机公钥，退出时清理。
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          unset SSH_KEY
          ssh_port="${SSH_PORT:-22}"

          # 与 startup 脚本读取的 ED25519 主机公钥对应；指纹匹配前不发送部署数据。
          ssh-keyscan -T 30 -p "$ssh_port" -t ed25519 "$SSH_HOST" > "$ssh_dir/known_hosts"
          actual_fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" -E sha256 | awk '{print $2}' | sort -u)
          if [ "$actual_fingerprint" != "$SSH_FINGERPRINT" ]; then
            echo "错误：SSH 服务器指纹不匹配，已终止部署。" >&2
            exit 1
          fi

          # Bash 引用保留密钥、JSON 等变量中的引号、换行和特殊字符。
          {
            printf 'export %s=%q\n' \
              ENC_KEY "$ENC_KEY" \
              PROXIES_JSON "$PROXIES_JSON" \
              REPO_PATH "$REPO_PATH" \
              TARGET_ENVIRONMENT "$TARGET_ENVIRONMENT" \
              BRANCH_NAME "$BRANCH_NAME" \
              RAW_ACTION "$RAW_ACTION" \
              RAW_STR "$RAW_STR" \
              USE_CACHE "$USE_CACHE"
            cat <<'REMOTE_SCRIPT'
            set -e

            cd /
            case "$TARGET_ENVIRONMENT" in
              "test")
                DEPLOY_ENV="cn"
                APP_ENV="test"
                DEPLOY_TO="cn-test"
                ;;
              "prod")
                DEPLOY_ENV="cn"
                APP_ENV="prod"
                DEPLOY_TO="cn-prod"
                ;;
              "prod_global")
                DEPLOY_ENV="global"
                APP_ENV="prod"
                DEPLOY_TO="global-prod"
                ;;
              *)
                echo "❌ 未知环境: $TARGET_ENVIRONMENT"
                exit 1
                ;;
            esac

            chmod +x "$REPO_PATH/build-git-pull.sh" || exit $?
            bash -e "$REPO_PATH/build-git-pull.sh" -branch_name "$BRANCH_NAME" -deploy-env "$DEPLOY_ENV" || exit $?

            ACTION=$(echo "$RAW_ACTION" | grep -oP '\(\K[^\)]+' || true)
            if [ -z "$ACTION" ]; then
              ACTION="$RAW_ACTION"
            fi

            if [ "$ACTION" = "pull_only" ]; then
              exit 0
            fi

            chmod +x "$REPO_PATH/build.sh"
            BUILD_PARAMS="-deploy-env ${DEPLOY_ENV} -env ${APP_ENV}"

            if [ "$ACTION" = "pull_prepare" ]; then
              BUILD_PARAMS="${BUILD_PARAMS} --prepare-only"
            fi

            if [ "$ACTION" = "frp" ]; then
              chmod +x "$REPO_PATH/build-frp.sh"

              FRP_PARAM=""
              FRP_EXTRA_PARAM=""
              if [ "$DEPLOY_TO" = "cn-prod" ]; then
                FRP_PARAM="--frps"
              elif [ "$DEPLOY_TO" = "cn-test" ]; then
                FRP_PARAM="--frpc"
                FRP_EXTRA_PARAM="--detach-up"
              else
                echo "ℹ️  当前环境不执行 frp 部署: $DEPLOY_TO"
                exit 0
              fi

              "$REPO_PATH/build-frp.sh" ${FRP_PARAM} ${FRP_EXTRA_PARAM}
              exit 0
            fi

            # 构建范围与步骤缓存独立选择；FRP 已在上方独立处理。
            BUILD_STRATEGY=$(echo "$RAW_STR" | grep -oP '\(\K[^\)]+')
            BUILD_PARAMS="${BUILD_PARAMS} --build-strategy ${BUILD_STRATEGY}"

            if [ "$USE_CACHE" = "false" ]; then
              BUILD_PARAMS="${BUILD_PARAMS} --no-cache"
            fi

            "$REPO_PATH/build.sh" ${BUILD_PARAMS}
          REMOTE_SCRIPT
          } > "$ssh_dir/deploy.sh"

          # 远端限制执行时间为 60 分钟，本地超时作为连接异常时的兜底。
          timeout --signal=TERM --kill-after=30s 61m \
            ssh -F /dev/null -T \
              -p "$ssh_port" \
              -i "$ssh_dir/key" \
              -l "$SSH_USERNAME" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$SSH_HOST" \
              'timeout --signal=TERM --kill-after=30s 60m bash -se' < "$ssh_dir/deploy.sh"
