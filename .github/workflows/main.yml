name: Deploy to Remote Server

on:
  workflow_dispatch:
    inputs:
      deployment_plan:
        description: '由本地 pnpm run deploy 生成的部署清单 JSON'
        required: true
        type: string

# SSH 部署无需使用 GITHUB_TOKEN 访问仓库 API。
permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      deploy_matrix: ${{ steps.resolve_envs.outputs.deploy_matrix }}
    steps:
      - name: 根据部署清单生成环境矩阵
        id: resolve_envs
        shell: bash
        env:
          DEPLOYMENT_PLAN: ${{ inputs.deployment_plan }}
        run: |
          set -euo pipefail
          deploy_matrix=$(jq -c '
            .branch as $branch | [.targets[] | . + {
              branch: $branch,
              environment: ({"cn-test":"test","cn-prod":"prod","global-prod":"prod_global"}[.target])
            }]
          ' <<< "$DEPLOYMENT_PLAN")
          echo "deploy_matrix=${deploy_matrix}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.deploy_matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      REPO_PATH: '/usr/local/egeek/repo'
      ENC_KEY: ${{ secrets.ENC_KEY }}
    steps:
      - name: 检查 SSH 服务器指纹
        shell: bash
        env:
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          if [[ ! "$SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "错误：请在当前 GitHub 环境中配置 SSH_FINGERPRINT，填写完整的 SHA256:... 指纹值。" >&2
            exit 1
          fi

      - name: 通过 SSH 执行部署
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          BRANCH_NAME: ${{ matrix.branch }}
          ACTION: ${{ matrix.action }}
          BUILD_STRATEGY: ${{ matrix.buildStrategy }}
          CLEAR_CACHE: ${{ matrix.clearCache }}
          DEPLOY_SERVICES_JSON: ${{ toJson(matrix.services) }}
        run: |
          set -euo pipefail

          # 临时保存登录密钥及经指纹校验的主机公钥，退出时清理。
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          unset SSH_KEY
          ssh_port="${SSH_PORT:-22}"

          # 兼容不同主机密钥类型，只信任指纹匹配的公钥及其对应算法。
          ssh-keyscan -T 30 -p "$ssh_port" -t ed25519,ecdsa,rsa "$SSH_HOST" > "$ssh_dir/host_keys"
          host_key_algorithms=""
          while IFS= read -r host_key; do
            printf '%s\n' "$host_key" > "$ssh_dir/candidate_key"
            actual_fingerprint=$(ssh-keygen -lf "$ssh_dir/candidate_key" -E sha256 2>/dev/null | awk '{print $2}') || continue
            [ "$actual_fingerprint" = "$SSH_FINGERPRINT" ] || continue

            case "$(awk '{print $2}' <<< "$host_key")" in
              ssh-ed25519) host_key_algorithms="ssh-ed25519" ;;
              ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521)
                host_key_algorithms="$(awk '{print $2}' <<< "$host_key")"
                ;;
              ssh-rsa) host_key_algorithms="rsa-sha2-512,rsa-sha2-256" ;;
              *) continue ;;
            esac
            printf '%s\n' "$host_key" > "$ssh_dir/known_hosts"
            break
          done < "$ssh_dir/host_keys"

          if [ -z "$host_key_algorithms" ]; then
            echo "错误：SSH 服务器指纹不匹配，已终止部署。" >&2
            exit 1
          fi

          # Bash 引用保留密钥、JSON 等变量中的引号、换行和特殊字符。
          {
            printf 'export %s=%q\n' \
              ENC_KEY "$ENC_KEY" \
              REPO_PATH "$REPO_PATH" \
              TARGET_ENVIRONMENT "$TARGET_ENVIRONMENT" \
              BRANCH_NAME "$BRANCH_NAME" \
              ACTION "$ACTION" \
              BUILD_STRATEGY "$BUILD_STRATEGY" \
              DEPLOY_SERVICES_JSON "$DEPLOY_SERVICES_JSON" \
              CLEAR_CACHE "$CLEAR_CACHE"
            cat <<'REMOTE_SCRIPT'
            set -e

            cd /
            case "$TARGET_ENVIRONMENT" in
              "test")
                DEPLOY_ENV="cn"
                APP_ENV="test"
                DEPLOY_TO="cn-test"
                ;;
              "prod")
                DEPLOY_ENV="cn"
                APP_ENV="prod"
                DEPLOY_TO="cn-prod"
                ;;
              "prod_global")
                DEPLOY_ENV="global"
                APP_ENV="prod"
                DEPLOY_TO="global-prod"
                ;;
              *)
                echo "❌ 未知环境: $TARGET_ENVIRONMENT"
                exit 1
                ;;
            esac

            chmod +x "$REPO_PATH/build-git-pull.sh" || exit $?
            bash -e "$REPO_PATH/build-git-pull.sh" -branch_name "$BRANCH_NAME" -deploy-env "$DEPLOY_ENV" || exit $?

            if [ "$ACTION" = "pull_only" ]; then
              exit 0
            fi

            chmod +x "$REPO_PATH/build.sh"
            BUILD_PARAMS=(-deploy-env "$DEPLOY_ENV" -env "$APP_ENV")

            if [ "$ACTION" = "pull_prepare" ]; then
              BUILD_PARAMS+=(--prepare-only)
            fi

            if [ "$ACTION" = "frp" ]; then
              chmod +x "$REPO_PATH/build-frp.sh"

              FRP_PARAM=""
              FRP_EXTRA_PARAM=""
              if [ "$DEPLOY_TO" = "cn-prod" ]; then
                FRP_PARAM="--frps"
              elif [ "$DEPLOY_TO" = "cn-test" ]; then
                FRP_PARAM="--frpc"
                FRP_EXTRA_PARAM="--detach-up"
              else
                echo "ℹ️  当前环境不执行 frp 部署: $DEPLOY_TO"
                exit 0
              fi

              "$REPO_PATH/build-frp.sh" ${FRP_PARAM} ${FRP_EXTRA_PARAM}
              exit 0
            fi

            # 构建范围与缓存清理独立选择；FRP 已在上方独立处理。
            BUILD_PARAMS+=(--build-strategy "$BUILD_STRATEGY")

            if [ "$ACTION" = "artifacts" ]; then
              BUILD_PARAMS+=(--services-json "$DEPLOY_SERVICES_JSON")
            fi

            if [ "$CLEAR_CACHE" = "true" ]; then
              BUILD_PARAMS+=(--clear-cache)
            fi

            "$REPO_PATH/build.sh" "${BUILD_PARAMS[@]}"
          REMOTE_SCRIPT
          } > "$ssh_dir/deploy.sh"

          # 远端限制执行时间为 60 分钟，本地超时作为连接异常时的兜底。
          timeout --signal=TERM --kill-after=30s 61m \
            ssh -F /dev/null -T \
              -p "$ssh_port" \
              -i "$ssh_dir/key" \
              -l "$SSH_USERNAME" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms="$host_key_algorithms" \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$SSH_HOST" \
              'timeout --signal=TERM --kill-after=30s 60m bash -se' < "$ssh_dir/deploy.sh"
